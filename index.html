<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1a1d24; --ink2:#5b6472; --ink3:#8a93a3;
    --line:#e6e9ef; --accent:#d81e3f; --accent2:#2f6fd0; --good:#1f9d6b; --warn:#e0952a;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:26px 22px 60px}
  /* ---------- header ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px rgba(16,24,40,.07);flex:0 0 auto}
  .logo svg{width:29px;height:29px;display:block}
  h1{margin:0;font-size:21px;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--ink3);font-size:12.5px;margin-top:3px}
  .sub a{color:var(--ink2);text-decoration:none;border-bottom:1px dotted #c8ced8}
  .stamp{font-size:12px;color:var(--ink3);text-align:right}
  .stamp b{color:var(--ink2);font-weight:600}
  /* ---------- kpi ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{background:var(--panel);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.6);position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85}
  .kpi:nth-child(2)::after{background:var(--accent2)}
  .kpi:nth-child(3)::after{background:var(--warn)}
  .kpi:nth-child(4)::after{background:var(--good)}
  .kpi .lab{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:5px}
  .kpi .val{font-size:26px;font-weight:660;letter-spacing:-.5px;margin-top:5px;font-variant-numeric:tabular-nums}
  .kpi .val small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:4px;letter-spacing:0}
  .kpi .note{font-size:11.5px;color:var(--ink3);margin-top:2px}
  /* ---------- panels ---------- */
  .panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 16px;margin-bottom:16px}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .ptitle{font-size:15px;font-weight:640;display:flex;align-items:center;gap:8px}
  .ptitle span.tag{font-size:11px;font-weight:500;color:var(--ink3);background:#f1f3f7;border-radius:20px;padding:2px 9px}
  .hint{font-size:11.5px;color:var(--ink3)}
  .seg{display:inline-flex;flex-wrap:wrap;background:#f1f3f7;border-radius:9px;padding:3px;gap:2px;max-width:100%}
  .seg button{border:0;background:transparent;color:var(--ink2);font-size:12.5px;padding:5px 11px;border-radius:7px;cursor:pointer;font-family:inherit;transition:.15s}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12);font-weight:600}
  /* ---------- charts ---------- */
  .chart{width:100%;position:relative}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .axis text{font-size:11px;fill:var(--ink3);font-variant-numeric:tabular-nums}
  .gridline{stroke:#eef0f4;stroke-width:1}
  .tip{position:absolute;pointer-events:none;background:rgba(26,29,36,.94);color:#fff;border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.5;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.22)}
  .tip.show{opacity:1}
  .tip .t{font-weight:600;margin-bottom:3px;font-size:12.5px}
  .tip .r{display:flex;justify-content:space-between;gap:16px;color:#cfd6e2}
  .tip .r b{color:#fff;font-variant-numeric:tabular-nums}
  /* ---------- line picker ---------- */
  .lines{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px 5px 8px;font-size:12.5px;cursor:pointer;color:var(--ink2);transition:.15s;user-select:none}
  .chip:hover{border-color:#cfd5e0}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35}
  .chip.on{color:var(--ink);border-color:#d5dae4;background:#fbfcfe;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .chip.on .dot{opacity:1}
  .chip .num{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:11.5px}
  /* ---------- rank bars ---------- */
  .rank{display:grid;grid-template-columns:1fr;gap:9px;margin-top:8px}
  .rk{display:grid;grid-template-columns:66px 1fr 74px;align-items:center;gap:10px;font-size:12.5px}
  .rk .nm{color:var(--ink2);display:flex;align-items:center;gap:6px}
  .rk .bar{height:9px;border-radius:5px;background:#f1f3f7;overflow:hidden}
  .rk .bar i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .rk .vv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:560}
  .rk .vv small{color:var(--ink3);font-weight:400;font-size:11px;margin-left:3px}
  /* ---------- heatmap ---------- */
  .heat{overflow-x:auto;padding-bottom:4px}
  .heat svg{min-width:640px}
  .hm-cell{transition:opacity .12s}
  .hm-cell:hover{opacity:.72;cursor:pointer}
  .legend-scale{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3);margin-top:8px;justify-content:flex-end}
  .legend-scale i{width:16px;height:10px;border-radius:3px;display:block}
  /* ---------- table ---------- */
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  input[type=search]{border:1px solid var(--line);background:#fbfcfd;border-radius:9px;padding:7px 11px;font-size:12.5px;font-family:inherit;color:var(--ink);width:190px;outline:none}
  input[type=search]:focus{border-color:#c3cbd8;background:#fff}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{border-color:#c9d0dc;color:var(--ink);background:#fbfcfd}
  .tw{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:11px;margin-top:12px}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
  thead th{position:sticky;top:0;background:#fafbfc;color:var(--ink2);font-weight:600;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;z-index:2;font-size:12px}
  thead th:first-child,thead th:nth-child(2){text-align:left}
  thead th:hover{color:var(--ink)}
  thead th .ar{color:var(--ink3);font-size:9px;margin-left:3px}
  tbody td{padding:8px 12px;text-align:right;border-bottom:1px solid #f2f4f8;white-space:nowrap}
  tbody td:first-child,tbody td:nth-child(2){text-align:left}
  tbody tr:hover td{background:#fafbfd}
  tbody td.tot{font-weight:620}
  .wk{color:var(--ink3);font-size:11.5px}
  .wk.we{color:#d81e3f}
  .pg{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px;font-size:12px;color:var(--ink3)}
  .pg .nav{display:flex;gap:6px}
  .pg button{min-width:30px;height:29px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit}
  .pg button:disabled{opacity:.4;cursor:default}
  .pg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* ---------- misc ---------- */
  .two{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
  footer{color:var(--ink3);font-size:11.5px;line-height:1.7;margin-top:8px;padding:0 4px}
  footer b{color:var(--ink2);font-weight:600}
  .empty{padding:40px;text-align:center;color:var(--ink3)}
  @media(max-width:940px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .two{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .wrap{padding:18px 13px 40px}
    .kpi .val{font-size:22px}
    h1{font-size:18px}
  }
</style>
</head>

const ROWS = DATA.rows;                       // [{d:'2026-10-16', t:399.40, l:{'1号线':78.46,...}}]
const LINES = DATA.lines;                     // ['1号线',...]
const COLORS = ['#d81e3f','#2f6fd0','#1f9d6b','#e0952a','#7b5cd6','#0e9aa7','#c2185b','#5b6472','#3f8f29','#b4690e','#8e44ad','#00796b','#c0392b','#4a6fa5','#a67c00'];
const lineColor = l => COLORS[LINES.indexOf(l) % COLORS.length];
const byDate = Object.fromEntries(ROWS.map(r => [r.d, r]));
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
const fmt = (v, n=2) => {
  if (v==null) return '—';
  let s = Number(v).toFixed(n);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
};
const fmt1 = v => v==null ? '—' : Number(v).toFixed(2);
const dayOf = d => new Date(d + 'T00:00:00');

const state = {
  range: 'all',
  selected: new Set(LINES.slice(0, 6)),
  sort: { key: 'd', dir: 'desc' },
  page: 1,
  pageSize: 20,
  q: '',
  heatYear: ROWS[ROWS.length-1].d.slice(0,4)
};

/* ---------------- 基础统计 ---------------- */
function viewRows(){
  if (state.range === 'all') return ROWS;
  const n = parseInt(state.range, 10);
  const last = dayOf(ROWS[ROWS.length-1].d).getTime();
  const cut = last - (n-1)*86400000;
  return ROWS.filter(r => dayOf(r.d).getTime() >= cut);
}
function stats(){
  const last = ROWS[ROWS.length - 1];
  const last30 = ROWS.slice(-30);
  const avg30 = last30.reduce((s,r)=>s+r.t,0)/last30.length;
  const peak = ROWS.reduce((a,b)=> b.t>a.t?b:a, ROWS[0]);
  return {last, avg30, peak, days: ROWS.length, first: ROWS[0].d};
}

function renderKpis(){
  const s = stats();
  const prev = ROWS[ROWS.length-2];
  const delta = prev ? (s.last.t - prev.t) : null;
  const dTxt = delta==null ? '' : `${delta>=0?'▲':'▼'} ${Math.abs(delta).toFixed(2)} vs 前一日`;
  const cards = [
    {lab:'最新一日客运量', val:fmt1(s.last.t), unit:'万人次', note:`${s.last.d} ${WD[dayOf(s.last.d).getDay()]}`},
    {lab:'近 30 日日均', val:fmt1(s.avg30), unit:'万人次', note:'滚动 30 天均值'},
    {lab:'历史单日峰值', val:fmt1(s.peak.t), unit:'万人次', note:`${s.peak.d} ${WD[dayOf(s.peak.d).getDay()]}`},
    {lab:'数据覆盖', val:s.days, unit:'天', note:`${s.first} 起`}
  ];
  document.getElementById('kpis').innerHTML = cards.map(c=>`
    <div class="kpi">
      <div class="lab">${c.lab}</div>
      <div class="val">${c.val}<small>${c.unit}</small></div>
      <div class="note">${c.note}${c.lab.includes('最新')&&dTxt?` · <span style="color:${delta>=0?'var(--accent)':'var(--good)'}">${dTxt}</span>`:''}</div>
    </div>`).join('');
  document.getElementById('stamp').innerHTML = `数据更新至 <b>${s.last.d}</b><br>共 <b>${s.days}</b> 天记录`;
  const span = Math.round((dayOf(s.last.d) - dayOf(s.first))/86400000) + 1;
  const cov = document.getElementById('cover');
  if (cov) cov.textContent = `时间跨度 ${span} 天，实际获取 ${s.days} 天（覆盖率 ${(s.days/span*100).toFixed(1)}%）。`;
}

/* ---------------- 折线/面积图 ---------------- */
function niceTicks(min, max, count=5){
  if (min === max){ min -= 1; max += 1; }
  const span = max - min;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10) * mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  const ticks=[]; for(let v=lo; v<=hi+1e-9; v+=step) ticks.push(+v.toFixed(6));
  return {lo, hi, ticks};
}

function areaChart(el, rows, opts){
  const W = el.clientWidth || 900, H = opts.height || 300;
  const m = {t:14, r:16, b:26, l:44};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  if (!rows.length){ el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const vals = rows.map(r=>r.v);
  const {lo, hi, ticks} = niceTicks(Math.min(...vals)*0.97, Math.max(...vals)*1.02, 5);
  const x = i => m.l + (rows.length===1 ? iw/2 : i*iw/(rows.length-1));
  const y = v => m.t + ih - (v-lo)/(hi-lo)*ih;
  const line = rows.map((r,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(r.v).toFixed(1)}`).join('');
  const area = `${line}L${x(rows.length-1).toFixed(1)},${m.t+ih}L${x(0).toFixed(1)},${m.t+ih}Z`;
  // 7 日移动平均
  let maPath = '';
  if (opts.ma !== false && rows.length > 7){
    const w = 7, ma = rows.map((r,i)=>{
      const seg = rows.slice(Math.max(0, i-w+1), i+1);
      return seg.reduce((a,b)=>a+b.v,0)/seg.length;
    });
    maPath = ma.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  }
  const step = Math.max(1, Math.ceil(rows.length/7));
  const xlab = rows.map((r,i)=> (i%step===0||i===rows.length-1) ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${r.label}</text>`:'').join('');
  const id = 'g'+Math.random().toString(36).slice(2,7);
  el.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
    <defs>
      <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${opts.color}" stop-opacity=".26"/>
        <stop offset="100%" stop-color="${opts.color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g class="axis">
      ${ticks.map(t=>`<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}"/>
        <text x="${m.l-9}" y="${y(t)+4}" text-anchor="end">${fmt(t,0)}</text>`).join('')}
      ${xlab}
    </g>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${opts.color}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
    ${maPath?`<path d="${maPath}" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4" opacity=".8"/>`:''}
    <g class="focus" opacity="0"></g>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" class="hit" style="cursor:crosshair"/>
  </svg>
  <div class="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), focus = el.querySelector('.focus');
  const hit = el.querySelector('.hit');
  const scaleX = () => el.clientWidth / W;
  hit.addEventListener('mousemove', ev=>{
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / scaleX();
    let i = Math.round((px - m.l) / (iw || 1) * (rows.length-1));
    i = Math.max(0, Math.min(rows.length-1, i));
    const r = rows[i];
    focus.setAttribute('opacity','1');
    focus.innerHTML = `<line x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${m.t+ih}" stroke="${opts.color}" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
      <circle cx="${x(i)}" cy="${y(r.v)}" r="4" fill="#fff" stroke="${opts.color}" stroke-width="2"/>`;
    tip.innerHTML = `<div class="t">${r.tipTitle||r.label}</div>${r.tipBody||`<div class="r"><span>客运量</span><b>${fmt1(r.v)} 万</b></div>`}`;
    tip.classList.add('show');
    tip.style.left = (x(i)*scaleX()) + 'px';
    tip.style.top  = (y(r.v)*scaleX() - 10) + 'px';
  });
  hit.addEventListener('mouseleave', ()=>{ tip.classList.remove('show'); focus.setAttribute('opacity','0'); });
  if (opts.onClick) hit.addEventListener('click', ev=>{
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / scaleX();
    let i = Math.round((px - m.l) / (iw || 1) * (rows.length-1));
    i = Math.max(0, Math.min(rows.length-1, i));
    opts.onClick(rows[i]);
  });
}

  hit.addEventListener('mousemove', ev=>{
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX-rect.left)/scaleX();
    let i = Math.round((px-m.l)/(iw||1)*(rows.length-1));
    i = Math.max(0, Math.min(rows.length-1, i));
    const r = rows[i];
    focus.setAttribute('opacity','1');
    focus.innerHTML = `<line x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${m.t+ih}" stroke="#98a2b3" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`;
    const list = series.map(s=>`<div class="r"><span style="color:${lineColor(s)}">${s}</span><b>${r.l[s]==null?'—':fmt1(r.l[s])}</b></div>`).join('');
    tip.innerHTML = `<div class="t">${r.d} ${r.n?'起的一周':WD[dayOf(r.d).getDay()]}</div>${list}<div class="r" style="border-top:1px solid #3a4050;margin-top:5px;padding-top:4px"><span>线网合计</span><b>${fmt1(r.t)}</b></div>`;
    tip.classList.add('show');
    tip.style.left = Math.min(Math.max(x(i)*scaleX(), 70), el.clientWidth-70) + 'px';
    tip.style.top = '12px';
    tip.style.transform = 'translate(-50%,0)';
  });
  hit.addEventListener('mouseleave', ()=>{ tip.classList.remove('show'); focus.setAttribute('opacity','0'); });
}

/* ---------------- 线路 chips ---------------- */
function renderChips(){
  const last = ROWS[ROWS.length-1];
  document.getElementById('lineChips').innerHTML = LINES.map(l=>{
    const on = state.selected.has(l);
    return `<div class="chip ${on?'on':''}" data-l="${l}" style="color:${on?lineColor(l):'var(--ink3)'}">
      <i class="dot" style="background:${lineColor(l)}"></i><span style="color:var(--ink)">${l}</span>
      <span class="num">${last && last.l[l]!=null?fmt1(last.l[l]):'—'}</span></div>`;
  }).join('');
  document.querySelectorAll('#lineChips .chip').forEach(c=>{
    c.onclick = ()=>{
      const l = c.dataset.l;
      if (state.selected.has(l)) { if (state.selected.size>1) state.selected.delete(l); }
      else state.selected.add(l);
      renderChips(); drawLineChart();
    };
  });
}

/* ---------------- 排名条 ---------------- */
function renderRank(){
  const last = ROWS[ROWS.length-1];
  document.getElementById('rankDate').textContent = `${last.d} ${WD[dayOf(last.d).getDay()]}`;
  const items = LINES.map(l=>({l, v:last.l[l]})).filter(o=>o.v!=null).sort((a,b)=>b.v-a.v);
  const max = Math.max(...items.map(o=>o.v));
  document.getElementById('rank').innerHTML = items.map(o=>`
    <div class="rk">
      <div class="nm"><i class="dot" style="width:7px;height:7px;border-radius:50%;background:${lineColor(o.l)};display:inline-block"></i>${o.l}</div>
      <div class="bar"><i style="width:${(o.v/max*100).toFixed(1)}%;background:${lineColor(o.l)}"></i></div>
      <div class="vv">${fmt1(o.v)}<small>万</small></div>
    </div>`).join('');
}

/* ---------------- 热力图 ---------------- */
function renderHeat(){
  const el = document.getElementById('heat');
  const byY = {};
  ROWS.forEach(r=>{ (byY[r.d.slice(0,4)] ||= []).push(r); });
  const years = Object.keys(byY).sort();
  // 年份切换
  const seg = document.getElementById('yearSeg');
  if (seg && !seg.dataset.built){
    seg.dataset.built = '1';
    seg.innerHTML = years.slice().reverse().map(y=>`<button data-y="${y}">${y}</button>`).join('') +
      `<button data-y="all">全部</button>`;
    seg.addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return;
      state.heatYear = b.dataset.y;
      renderHeat();
    });
  }
  if (seg) seg.querySelectorAll('button').forEach(b=> b.classList.toggle('on', b.dataset.y === state.heatYear));
  const shown = state.heatYear === 'all' ? years : years.filter(y=> y === state.heatYear);
  const cell=13, gap=3, leftPad=30, topPad=18;
  const maxV = Math.max(...ROWS.map(r=>r.t));
  const minV = Math.min(...ROWS.map(r=>r.t));
  const colorOf = v=>{
    const t = Math.max(0, Math.min(1, (v-minV)/(maxV-minV||1)));
    const stops = [[247,243,244],[251,214,220],[240,150,168],[216,30,63],[140,10,35]];
    const p = t*(stops.length-1), i = Math.floor(p), f = p-i;
    const a = stops[i], b = stops[Math.min(stops.length-1,i+1)];
    return `rgb(${a.map((c,k)=>Math.round(c+(b[k]-c)*f)).join(',')})`;
  };
  let html='';
  shown.forEach(y=>{
    const start = new Date(y+'-01-01T00:00:00');
    const end = new Date(y+'-12-31T00:00:00');
    const days = Math.round((end-start)/86400000)+1;
    const cols = Math.ceil((days + start.getDay())/7);
    const W = leftPad + cols*(cell+gap) + 8, H = topPad + 7*(cell+gap) + 4;
    let cells='';
    for (let i=0;i<days;i++){
      const dt = new Date(start.getTime()+i*86400000);
      const key = `${y}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      const rec = byDate[key];
      const col = Math.floor((i+start.getDay())/7), row = (i+start.getDay())%7;
      const cx = leftPad + col*(cell+gap), cy = topPad + row*(cell+gap);
      if (rec) cells += `<rect class="hm-cell" data-d="${key}" x="${cx}" y="${cy}" width="${cell}" height="${cell}" rx="2.5" fill="${colorOf(rec.t)}"><title>${key} ${WD[dt.getDay()]} · ${fmt1(rec.t)} 万</title></rect>`;
      else cells += `<rect x="${cx}" y="${cy}" width="${cell}" height="${cell}" rx="2.5" fill="#e9ecf3"><title>${key} 无数据</title></rect>`;
    }
    const mons = [];
    for (let mo=0; mo<12; mo++){
      const first = new Date(y, mo, 1);
      const idx = Math.round((first-start)/86400000) + start.getDay();
      const col = Math.floor(idx/7);
      mons.push(`<text x="${leftPad+col*(cell+gap)}" y="${topPad-6}" class="axis" font-size="10" fill="#8a93a3">${mo+1}月</text>`);
    }
    const wd = ['日','一','二','三','四','五','六'].map((d,i)=> i%2===0?`<text x="${leftPad-7}" y="${topPad+i*(cell+gap)+cell-3}" text-anchor="end" font-size="9.5" fill="#8a93a3">${d}</text>`:'').join('');
    html += `<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:2px">${y} 年</div>
      <svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,900)}px;max-width:100%">${mons}${wd}${cells}</svg></div>`;
  });
  html += `<div class="legend-scale">低 ${[0.15,0.35,0.55,0.75,0.95].map(t=>`<i style="background:${colorOf(minV+t*(maxV-minV))}"></i>`).join('')} 高 <span style="margin-left:8px">${fmt1(minV)} – ${fmt1(maxV)} 万</span></div>`;
  el.innerHTML = html;
  el.querySelectorAll('.hm-cell').forEach(c=>{
    c.onclick = ()=>{ document.getElementById('q').value = c.dataset.d; state.q = c.dataset.d; state.page=1; renderTable(); document.querySelector('#tbl').scrollIntoView({behavior:'smooth',block:'center'}); };
  });
}

/* ---------------- 表格 ---------------- */
function tableRows(){
  let rs = ROWS.slice().reverse();
  if (state.q.trim()){
    const q = state.q.trim();
    rs = rs.filter(r=> r.d.includes(q));
  }
  const {key, dir} = state.sort;
  const mult = dir==='asc'?1:-1;
  rs.sort((a,b)=>{
    let va, vb;
    if (key==='d'){ va=a.d; vb=b.d; return va<vb?-mult:va>vb?mult:0; }
    if (key==='t'){ va=a.t; vb=b.t; }
    else if (key==='wd'){ va=dayOf(a.d).getDay(); vb=dayOf(b.d).getDay(); }
    else { va=a.l[key]??-1; vb=b.l[key]??-1; }
    return (va-vb)*mult;
  });
  return rs;
}
function renderTable(){
  const cols = [{k:'d',n:'日期'},{k:'wd',n:'星期'},{k:'t',n:'线网合计'},...LINES.map(l=>({k:l,n:l}))];
  document.getElementById('thead').innerHTML = cols.map(c=>{
    const ar = state.sort.key===c.k ? (state.sort.dir==='asc'?'▲':'▼') : '';
    return `<th data-k="${c.k}">${c.n}<span class="ar">${ar}</span></th>`;
  }).join('');
  const all = tableRows();
  const total = all.length, pages = Math.max(1, Math.ceil(total/state.pageSize));
  state.page = Math.min(state.page, pages);
  const start = (state.page-1)*state.pageSize;
  const rows = all.slice(start, start+state.pageSize);
  document.getElementById('tbody').innerHTML = rows.length ? rows.map(r=>{
    const wd = dayOf(r.d).getDay();
    return `<tr><td>${r.d}</td><td class="wk ${wd===0||wd===6?'we':''}">${WD[wd]}</td><td class="tot">${fmt1(r.t)}</td>
      ${LINES.map(l=>`<td>${r.l[l]==null?'—':fmt1(r.l[l])}</td>`).join('')}</tr>`;
  }).join('') : `<tr><td colspan="${cols.length}" class="empty">没有匹配的数据</td></tr>`;
  document.getElementById('pgInfo').textContent = `共 ${total} 天 · 第 ${state.page} / ${pages} 页`;
  const nav = document.getElementById('pgNav');
  const btn = (label, page, dis, on)=>`<button data-p="${page}" ${dis?'disabled':''} class="${on?'on':''}">${label}</button>`;
  let html = btn('‹', state.page-1, state.page<=1);
  const nums = [];
  for (let p=1;p<=pages;p++){ if (p===1||p===pages||Math.abs(p-state.page)<=1) nums.push(p); else if (nums[nums.length-1]!=='…') nums.push('…'); }
  nums.forEach(p=> html += p==='…'?`<button disabled>…</button>`:btn(p,p,false,p===state.page));
  html += btn('›', state.page+1, state.page>=pages);
  nav.innerHTML = html;
  nav.querySelectorAll('button[data-p]').forEach(b=> b.onclick = ()=>{ const p=+b.dataset.p; if(p>=1&&p<=pages){ state.page=p; renderTable(); } });
  document.querySelectorAll('#thead th').forEach(th=>{
    th.onclick = ()=>{
      const k = th.dataset.k;
      if (state.sort.key===k) state.sort.dir = state.sort.dir==='asc'?'desc':'asc';
      else state.sort = {key:k, dir: k==='d'?'desc':'desc'};
      renderTable();
    };
  });
}

/* ---------------- 导出 ---------------- */
function exportCsv(){
  const cols = ['日期','星期','线网合计',...LINES];
  const lines = [cols.join(',')];
  tableRows().slice().reverse().forEach(r=>{
    lines.push([r.d, WD[dayOf(r.d).getDay()], r.t, ...LINES.map(l=> r.l[l]??'')].join(','));
  });
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '南京地铁客流量.csv';
  a.click();
}

/* ---------------- 绘制 ---------------- */
function spanDays(rows){
  return rows.length ? Math.round((dayOf(rows[rows.length-1].d) - dayOf(rows[0].d))/86400000) + 1 : 0;
}
function axisLabel(d, span){ return span > 400 ? d.slice(2,7) : d.slice(5); }

function weeklyAgg(rows){
  const out = []; let cur = null;
  rows.forEach(r=>{
    const dt = dayOf(r.d);
    const mon = new Date(dt.getTime());
    mon.setDate(dt.getDate() - ((dt.getDay()+6)%7));
    const key = `${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`;
    if (!cur || cur.key !== key){ cur = {key, t:0, l:{}, n:0, days:[]}; out.push(cur); }
    cur.t += r.t; cur.n++;
    cur.days.push(r.d);
    Object.keys(r.l).forEach(k=>{ cur.l[k] = (cur.l[k]||0) + r.l[k]; });
  });
  return out.map(o=>{
    const l = {};
    Object.keys(o.l).forEach(k=> l[k] = +(o.l[k]/o.n).toFixed(2));
    return {d:o.key, t:+(o.t/o.n).toFixed(2), l, n:o.n, lastDay:o.days[o.days.length-1]};
  });
}

function drawMain(){
  const raw = viewRows();
  const span = spanDays(raw);
  const useWeek = state.range === 'all' && raw.length > 700;
  const src = useWeek ? weeklyAgg(raw) : raw;
  const prevOf = (i)=> i>0 ? src[i-1] : null;
  const rows = src.map((r,i)=>({
    label: axisLabel(r.d, span),
    v: r.t,
    tipTitle: useWeek ? `${r.d} 起的一周` : `${r.d} ${WD[dayOf(r.d).getDay()]}`,
    tipBody: `<div class="r"><span>${useWeek?'周均客运量':'线网客运量'}</span><b>${fmt1(r.t)} 万</b></div>` +
      (useWeek ? `<div class="r"><span>覆盖天数</span><b>${r.n} 天</b></div>` : '') +
      `<div class="r"><span>较前${useWeek?'周':'日'}</span><b>${(()=>{const p=prevOf(i); return p?((r.t-p.t>=0?'+':'')+(r.t-p.t).toFixed(2)):'—';})()}</b></div>`
  }));
  document.getElementById('rangeTag').textContent = state.range==='all'
    ? `全部 ${raw.length} 天${useWeek?' · 按周均':''}`
    : `${raw.length} 天`;
  areaChart(document.getElementById('mainChart'), rows, {color:'#d81e3f', height:300});
}
function drawLineChart(){
  const raw = viewRows();
  const useWeek = state.range === 'all' && raw.length > 700;
  const rows = useWeek ? weeklyAgg(raw) : raw;
  multiLineChart(document.getElementById('lineChart'), rows, [...state.selected], {height:280});
}

function renderAll(){ renderKpis(); drawMain(); renderChips(); drawLineChart(); renderRank(); renderHeat(); renderTable(); }

document.getElementById('rangeSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#rangeSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  state.range = b.dataset.r;
  drawMain(); drawLineChart();
});
document.getElementById('q').addEventListener('input', e=>{ state.q = e.target.value; state.page=1; renderTable(); });
document.getElementById('exportBtn').onclick = exportCsv;

let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ drawMain(); drawLineChart(); }, 180); });
renderAll();
</script>
